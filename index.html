<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自動組隊</title>
<style>
  :root {
    --bg: #f4f7f5; --card: #ffffff; --ink: #13201a; --muted: #55655b; --line: #d8e0db;
    --accent: #0a8a3d; --accent-ink: #ffffff; --soft: #e2f4e8; --bad: #b42318;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1511; --card: #151e19; --ink: #e6eee9; --muted: #9fb0a6; --line: #26332c;
      --accent: #35d072; --accent-ink: #06210f; --soft: #163223; --bad: #ff9a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
             max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  main { max-width: 480px; margin: 0 auto; display: grid; gap: 10px; }
  h1 { margin: 0; font-size: 1.1rem; letter-spacing: .02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
  .card p { margin: 0; }
  .card .meta { font-size: .9375rem; line-height: 1.5; }
  .questions { white-space: pre-line; overflow-wrap: anywhere; }
  .label { margin: 0; font-size: .8125rem; color: var(--muted); letter-spacing: .06em; }
  .big { margin: 0; font-size: 1.5rem; font-weight: 700; line-height: 1.25; }
  .hint { margin: 0; font-size: .875rem; color: var(--muted); }
  .members { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .members li { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .members .name { overflow-wrap: anywhere; }
  .members li.me { background: var(--soft); border-color: var(--accent); }
  .tag { flex: none; font-size: .75rem; font-weight: 700; color: var(--accent); }
  form { display: grid; gap: 10px; }
  label { font-size: .875rem; font-weight: 600; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; letter-spacing: .08em;
  }
  button {
    font: inherit; font-weight: 700; padding: 12px 16px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .leave { margin-top: 6px; }
  .leave .row { display: flex; gap: 8px; }
  .leave .msg { min-height: 0; }
  .leave button.ghost { padding: 5px 12px; font-size: .875rem; }
  .big + .members { margin-top: 2px; }
  a.linkbtn { display: inline-block; margin-top: 4px; text-align: center; padding: 10px 16px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 600; padding: 8px 14px; }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg { margin: 0; min-height: 1.4em; font-size: .875rem; color: var(--bad); }
  [hidden] { display: none !important; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .foot { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .foot .hint { font-size: .75rem; white-space: nowrap; }
  .foot button.ghost { padding: 4px 10px; font-size: .8125rem; white-space: nowrap; }
  .hd { display: flex; align-items: baseline; gap: 10px; }
  .members { display: flex !important; flex-wrap: wrap; }
  .members li { border-radius: 999px; padding: 3px 12px; gap: 8px; }
  .questions { font-size: .9rem; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 id="site">自動組隊</h1>
    <div id="foot" class="foot" hidden>
      <span class="hint" id="stamp"></span>
      <button class="ghost" id="reload" type="button">重新整理</button>
    </div>
  </header>
  <div id="view" aria-live="polite"><section class="card"><p class="hint">載入中…</p></section></div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  'use strict';

  /* 這兩個值公開沒關係。邀請碼不要放在前端。 */
  var LIFF_ID = '2012341027-MJ9CKosb';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwqSmMUMeupZ80c5r3iX5-cKj5a4oHzmfMYhYLPs5Ulae2VRxwnhTBRZlwpDw0SoFAY/exec';
  var REFRESH_MS = 60000;

  var ERR = {
    bad_code: '邀請碼不正確。',
    locked: '錯誤次數過多，請 10 分鐘後再試。',
    closed: '報名已結束。',
    full: '報名人數已滿。',
    busy: '系統忙碌中，請再按一次。',
    auth: '登入已逾時，請重新登入。',
    relogin_fail: 'LINE 登入狀態一直失效：請關閉這個頁面，再從 LINE 重新開啟；仍不行請更新 LINE App。',
    config: '系統尚未設定完成，請聯絡主辦人。',
    server: '發生錯誤，請稍後再試。'
  };

  var view = document.getElementById('view');
  var foot = document.getElementById('foot');
  var stamp = document.getElementById('stamp');
  var current = null;
  var loading = false;

  /* 建立 DOM。文字一律走 textContent，暱稱不會被當成 HTML。 */
  function h(tag, props, kids) {
    var el = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') el.textContent = props[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), props[k]);
      else el.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
    return el;
  }

  function fmt(iso) {
    try {
      return new Date(iso).toLocaleString('zh-TW', {
        timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', weekday: 'short',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
    } catch (e) { return iso; }
  }

  function errText(e) { return ERR[e && e.code] || ERR.server; }

  /* ── 連線層：Google 入口偶爾卡住或把 POST 轉成 GET，這裡統一處理 ───────────── */
  var HEDGE_MS = 6000, LOG_KEY = 'tm_log', RELOGIN_KEY = 'tm_relogin';
  var T0 = performance.now();

  function isStub(j) { return !!(j && j.ok && j.service && !j.status && !j.counts); }   /* doGet 的版本資訊，不是資料 */

  var FE_VER = '2026-11-02-diag';
  /* 回報用的環境資訊：前端版本、LINE 版本、系統、是否在 LINE 內、網路品質、螢幕（不含任何個資） */
  function deviceInfo() {
    var d = ['FE ' + FE_VER];
    try {
      var ua = navigator.userAgent || '', m;
      d.push((m = ua.match(/Line\/([\d.]+)/)) ? 'LINE ' + m[1] : 'non-LINE');
      d.push((m = ua.match(/Android ([\d.]+)/)) ? 'Android ' + m[1] : (m = ua.match(/OS ([\d_]+) like Mac/)) ? 'iOS ' + m[1].replace(/_/g, '.') : 'OS?');
    } catch (_) {}
    try { d.push(liff.isInClient() ? 'inClient' : 'external'); d.push('liff ' + liff.getVersion()); d.push(liff.getLanguage()); } catch (_) {}
    try { var c = navigator.connection; if (c) d.push('net ' + (c.effectiveType || '?') + ' rtt' + (c.rtt || '?') + ' dl' + (c.downlink || '?')); } catch (_) {}
    try { d.push(screen.width + 'x' + screen.height); } catch (_) {}
    return d.join(' | ').slice(0, 200);
  }
  function queueLog(l) {
    l.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    l.device = deviceInfo();
    try {
      var q = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); q.push(l);
      localStorage.setItem(LOG_KEY, JSON.stringify(q.slice(-10)));
    } catch (_) {}
  }
  function flushLogs() {
    var q = []; try { q = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (_) {}
    if (!q.length) return;
    try {
      fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'client_log', logs: q }), keepalive: true })
        .then(function (r) { return r.text(); })
        .then(function (t) { if (JSON.parse(t).ok) try { localStorage.removeItem(LOG_KEY); } catch (_) {}; })
        .catch(function () {});
    } catch (_) {}
  }

  /* 沒接住的 JS 錯誤也回報（最多留 10 筆、後端每小時最多收 300 筆） */
  window.addEventListener('error', function (e) {
    queueLog({ what: '頁面錯誤', result: 'JS error', ms: 0, detail: String(e.message || '') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0) });
    flushLogs();
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    queueLog({ what: '頁面錯誤', result: 'unhandled', ms: 0, detail: String(r && (r.message || r.code || r)).slice(0, 200) });
    flushLogs();
  });

  /* 讀取用「避險請求」：HEDGE_MS 沒回就再送一次（最多 tries 次），誰先回來用誰；
     收到版本資訊（POST 被轉成 GET）時，下一次改用 GET ?q= 帶資料。 */
  function gasFetch(body, tries, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var started = 0, running = 0, settled = false, lastBad = null, sawStub = false, hedge = null;
      var ctls = [], notes = [];
      function finish(fn, v) {
        if (settled) return; settled = true; clearTimeout(hedge);
        ctls.forEach(function (c) { try { c.abort(); } catch (_) {} });
        fn(v);
      }
      function start() {
        clearTimeout(hedge);
        if (settled || started >= tries) return;
        if (running > 0) notes.push('#' + started + ' ' + HEDGE_MS / 1000 + ' 秒沒回，加送');
        var n = ++started, ac = new AbortController(); running++; ctls.push(ac);
        var to = setTimeout(function () { ac.abort(); }, timeoutMs);
        if (started < tries) hedge = setTimeout(start, HEDGE_MS);
        var useGet = sawStub && body.length < 6000;
        var req = useGet ? fetch(GAS_URL + '?q=' + encodeURIComponent(body), { signal: ac.signal })
                         : fetch(GAS_URL, { method: 'POST', body: body, signal: ac.signal });
        req.then(function (res) {
          return res.text().then(function (txt) {
            var j = null; try { j = JSON.parse(txt); } catch (_) {}
            if (j && !isStub(j)) return finish(resolve, { res: res, txt: txt, j: j, n: n, notes: notes });
            if (isStub(j)) sawStub = true;
            notes.push('#' + n + (useGet ? 'GET' : '') + ' ' + (j ? '回應不完整' : 'HTTP ' + res.status));
            lastBad = { res: res, txt: txt, j: j, n: n, notes: notes };
          });
        }).catch(function (e) {
          if (settled) return;
          notes.push('#' + n + (useGet ? 'GET' : '') + ' ' + (e.name === 'AbortError' ? '逾時' : (e.message || e)));
          if (!lastBad || lastBad.txt === undefined) lastBad = e;
        }).then(function () {
          clearTimeout(to); running--;
          if (settled) return;
          if (started < tries) start();                          /* 失敗就馬上補送，不用等避險計時 */
          else if (running === 0) finish(reject, lastBad);
        });
      }
      start();
    });
  }

  /* LINE 憑證約 1 小時過期：過期就登出再登入換新的，最多 2 次，避免無限重新整理 */
  function tokenExpired() {
    try { var d = liff.getDecodedIDToken(); return !d || !d.exp || d.exp * 1000 < Date.now() + 60000; }
    catch (_) { return true; }
  }
  function relogin() {
    var n = 0;
    try { n = Number(sessionStorage.getItem(RELOGIN_KEY) || 0); sessionStorage.setItem(RELOGIN_KEY, n + 1); } catch (_) {}
    if (n >= 2) { try { sessionStorage.removeItem(RELOGIN_KEY); } catch (_) {} return false; }
    queueLog({ what: '重新登入', result: 'LINE 憑證過期，第 ' + (n + 1) + ' 次', ms: 0, detail: '' });
    liff.logout();
    if (liff.isInClient()) location.reload(); else liff.login({ redirectUri: location.href });
    return true;
  }
  function apiErr(code, detail) { var e = new Error(code); e.code = code; e.detail = detail || ''; return e; }

  /* 回傳 {j, probed}；寫入（write 函式）由各頁自己決定怎麼補救 */
  async function callRaw(body, tries) {
    var r, tA = performance.now();
    try { r = await gasFetch(body, tries, 45000); }
    catch (bad) {
      if (bad && bad.txt !== undefined) r = bad;
      else {
        queueLog({ what: '請求', result: '連線失敗或逾時', ms: Math.round(performance.now() - tA), detail: String(bad && (bad.message || bad)) });
        throw apiErr('server');
      }
    }
    if (r.n > 1) queueLog({ what: '請求', result: '第 ' + r.n + ' 次才成功', ms: Math.round(performance.now() - tA), detail: r.notes.join('；') });
    var j = r.j;
    if (!j || isStub(j)) {
      var t = ((r.txt || '').match(/<title>([^<]*)<\/title>/i) || [])[1] || '';
      queueLog({ what: '請求', result: j ? '回應不完整' : '非 JSON HTTP ' + (r.res && r.res.status), ms: Math.round(performance.now() - tA), detail: t.trim() });
      throw apiErr('server', t.trim());
    }
    if (!j.ok) { var e = apiErr(j.error); e.data = j; throw e; }
    try { sessionStorage.removeItem(RELOGIN_KEY); } catch (_) {}
    return { j: j, r: r };
  }

  /* 報名（會寫入）不能盲目重送：12 秒沒回應或連線中斷，就查「我的狀態」確認是否已經報名成功 */
  function writeJoin(body) {
    return new Promise(function (resolve, reject) {
      var settled = false, probing = false, origDone = false, origErr = null, timer = null;
      function finish(fn, v) { if (settled) return; settled = true; clearTimeout(timer); fn(v); }
      async function probe() {
        if (probing || settled) return; probing = true;
        for (var i = 0; i < 3 && !settled; i++) {
          try {
            var p = await gasFetch(JSON.stringify({ action: 'me', idToken: liff.getIDToken() }), 2, 20000);
            if (settled) return;
            if (p.j && p.j.ok && p.j.status && p.j.status !== 'unregistered') {
              queueLog({ what: 'join', result: '回應遺失，查詢確認已成立', ms: 0, detail: '第 ' + (i + 1) + ' 次查詢' });
              return finish(resolve, { j: p.j });
            }
          } catch (_) {}
          if (origDone && i >= 1) break;
          await new Promise(function (r) { setTimeout(r, 4000); });
        }
        if (origDone) finish(reject, origErr || apiErr('server'));
      }
      callRaw(body, 1).then(function (v) { finish(resolve, v); }).catch(function (e) {
        origDone = true; origErr = e;
        if (e && e.code && e.code !== 'server') return finish(reject, e);   /* 後端有明確回答（邀請碼錯等） */
        if (!probing) { clearTimeout(timer); probe(); }
      });
      timer = setTimeout(probe, 12000);
    });
  }

  async function api(action, extra, write) {
    if (tokenExpired()) { throw relogin() ? apiErr('auth') : apiErr('relogin_fail'); }
    var body = JSON.stringify(Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {}));
    var v = write ? await writeJoin(body) : await callRaw(body, 3);
    return v.j;
  }

  /* 上次的畫面先顯示（24 小時內），再背景更新；只存已報名的狀態 */
  var VIEW_KEY = 'tm_view', reqSeq = 0, appliedSeq = 0;
  function saveView(r) { try { if (r && r.status && r.status !== 'unregistered') localStorage.setItem(VIEW_KEY, JSON.stringify({ t: Date.now(), r: r })); else localStorage.removeItem(VIEW_KEY); } catch (_) {} }
  function loadView() {
    try { var c = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); return c && Date.now() - c.t < 86400000 ? c.r : null; } catch (_) { return null; }
  }

  function show(nodes) {
    view.textContent = '';
    nodes.forEach(function (n) { view.appendChild(n); });
    foot.hidden = false;
  }

  function card(kids) { return h('section', { class: 'card' }, kids); }

  /* 本次課程（題目、日期、備註）：管理員在後台填，沒填就不顯示 */
  function classCard(info) {
    if (!info || !(info.classTitle || info.classDate || info.classTeacher || info.classNote || info.classQuestions)) return null;
    return card([
      h('div', { class: 'hd' }, [h('p', { class: 'label', text: '本次課程' }), info.classTitle ? h('p', { class: 'big', text: info.classTitle }) : null]),
      info.classDate ? h('p', { class: 'meta', text: '上課時間：' + fmt(info.classDate) }) : null,
      info.classTeacher ? h('p', { class: 'meta', text: '本周教師：' + info.classTeacher }) : null,
      info.classNote ? h('p', { class: 'hint', text: info.classNote }) : null,
      info.classQuestions ? h('p', { class: 'questions', text: '討論問題\n' + info.classQuestions }) : null
    ]);
  }

  /* 退出組隊：兩段式確認；後端可重複送，所以走一般的避險重送 */
  function leaveBox(info) {
    if (!info || info.phase === 'ended') return null;
    var msg = h('p', { class: 'msg', role: 'alert' });
    var box = h('div', { class: 'leave' });
    function idle() {
      box.textContent = '';
      box.appendChild(h('button', { type: 'button', class: 'ghost', text: '退出組隊', onclick: ask }));
      box.appendChild(msg);
    }
    function ask() {
      box.textContent = '';
      var yes = h('button', { type: 'button', text: '確定退出', onclick: function () {
        yes.disabled = true; no.disabled = true; msg.textContent = '';
        var seq = ++reqSeq;
        api('leave', {}, false).then(function (r) { appliedSeq = Math.max(appliedSeq, seq); render(r); }).catch(function (e) {
          msg.textContent = errText(e); yes.disabled = false; no.disabled = false;
        });
      } });
      var no = h('button', { type: 'button', class: 'ghost', text: '取消', onclick: idle });
      box.appendChild(h('p', { class: 'hint', text: '退出後會從目前的組別移除，報名關閉前可以重新報名（要再重新加入）。' }));
      box.appendChild(h('div', { class: 'row' }, [yes, no]));
      box.appendChild(msg);
    }
    idle();
    return box;
  }

  function linkNode(info) {
    var u = info && info.groupLink;
    if (!u || !/^https:\/\//.test(u)) return null;                  // 只接受 https，避免 javascript: 之類
    return h('a', { class: 'linkbtn', href: u, target: '_blank', rel: 'noopener noreferrer', text: '開啟分組連結' });
  }

  function renderGrouped(r) {
    var info = r.info || {};
    var list = h('ul', { class: 'members' }, r.members.map(function (m) {
      return h('li', { class: m.me ? 'me' : '' }, [
        h('span', { class: 'name', text: m.name }),
        m.me ? h('span', { class: 'tag', text: '你' }) : null
      ]);
    }));
    var more = r.members.length < info.groupMax && info.phase !== 'ended';
    return [card([
      h('div', { class: 'hd' }, [h('p', { class: 'label', text: '你的組別' }), h('p', { class: 'big', text: r.groupId })]),
      list,
      more ? h('p', { class: 'hint', text: '目前 ' + r.members.length + ' 人，之後可能再有人加入這一組。' }) : null,
      linkNode(info),
      leaveBox(info)
    ])];
  }

  /* 後台開啟 selfGroup 時才顯示：學員自己按下去，就把目前等待的人分組 */
  function selfGroupBox(info) {
    if (!info || !info.selfGroup || info.phase === 'ended') return null;
    var msg = h('p', { class: 'msg', role: 'status' });
    var btn = h('button', { type: 'button', text: '立刻分組', onclick: function () {
      btn.disabled = true; msg.textContent = '';
      var seq = ++reqSeq;
      api('group_now', {}, false).then(function (r) {
        appliedSeq = Math.max(appliedSeq, seq);
        if (r.status === 'grouped') return render(r);
        render(r);
        var m = document.getElementById('sg-msg'); if (m) m.textContent = '目前等待的人數還不夠成組，有更多人加入後再按一次。';
      }).catch(function (e) { msg.textContent = errText(e); btn.disabled = false; });
    } });
    msg.id = 'sg-msg';
    return h('div', { class: 'sg' }, [h('p', { class: 'hint', text: '人到齊了？按下去會立刻把目前等待的人分組。' }), btn, msg]);
  }

  function renderWaiting(r) {
    var info = r.info || {};
    var hint;
    if (info.autoGroup === false && info.phase !== 'ended') {
      hint = '管理員會在人到齊後統一分組，分好組這裡會自動顯示，請稍候。';
    } else if (info.phase === 'early') {
      hint = '等待人數達 ' + info.batchThreshold + ' 人，或 ' + fmt(info.deadline) + ' 截止時，系統會隨機分組。';
    } else if (info.phase === 'late') {
      hint = '有新成員加入時會立即配對，' + fmt(info.closeAt) + ' 前都會持續處理。';
    } else {
      hint = '報名已結束，你目前沒有分到組別，請聯絡主辦人。';
    }
    return [card([
      h('p', { class: 'label', text: '狀態' }),
      h('p', { class: 'big', text: '等待分組' }),
      h('p', { text: '目前有 ' + r.poolSize + ' 人在等待。' }),
      h('p', { class: 'hint', text: hint }),
      selfGroupBox(info),
      leaveBox(info)
    ])];
  }

  function renderJoin(r) {
    if (!r.registrationOpen) {
      return [card([
        h('p', { class: 'label', text: '狀態' }),
        h('p', { class: 'big', text: '報名已結束' })
      ])];
    }
    var info = r.info || {};
    var needCode = info.requireCode !== false;
    var input = !needCode ? null : h('input', { id: 'code', type: 'text', autocomplete: 'off', autocapitalize: 'characters',
                             maxlength: '32', placeholder: '輸入邀請碼' });
    var msg = h('p', { class: 'msg', role: 'alert' });
    var btn = h('button', { type: 'submit', text: '加入組隊' });
    var form = h('form', { onsubmit: function (ev) {
      ev.preventDefault();
      var code = needCode ? input.value.trim() : '';
      if (needCode && !code) { msg.textContent = '請輸入邀請碼。'; return; }
      btn.disabled = true; msg.textContent = '';
      var seq = ++reqSeq;
      api('join', { code: code }, true).then(function (r) { appliedSeq = Math.max(appliedSeq, seq); render(r); }).catch(function (e) {
        msg.textContent = errText(e); btn.disabled = false;
      });
    } }, needCode ? [h('label', { for: 'code', text: '邀請碼' }), input, btn, msg] : [btn, msg]);
    return [card([
      h('p', { class: 'label', text: '加入組隊' }),
      h('p', { class: 'big', text: needCode ? '輸入邀請碼' : '按下加入即可' }),
      h('p', { class: 'hint', text: fmt(info.deadline) + ' 截止時，等待中的人會全部分完。每組 ' +
        info.groupMin + ' 到 ' + info.groupMax + ' 人。' }),
      form
    ])];
  }

  function render(r) {
    current = r; saveView(r);
    var nodes = r.status === 'grouped' ? renderGrouped(r)
              : r.status === 'waiting' ? renderWaiting(r)
              : renderJoin(r);
    var st = (r.info && r.info.siteTitle) || '自動組隊';
    document.getElementById('site').textContent = st; document.title = st;
    show(nodes.concat([classCard(r.info)]).filter(Boolean));
    stamp.textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW', { hour12: false });
  }

  function renderError(e) {
    try { queueLog({ what: '畫面錯誤', result: String((e && e.code) || 'unknown'), ms: Math.round(performance.now() - T0), detail: String((e && e.detail) || (e && e.message) || '') }); flushLogs(); } catch (_) {}
    var nodes = [card([
      h('p', { class: 'label', text: '發生問題' }),
      h('p', { text: errText(e) }),
      h('button', { type: 'button', text: e && e.code === 'auth' ? '重新登入' : '重試', onclick: function () {
        if (e && e.code === 'auth') { if (!relogin()) renderError(apiErr('relogin_fail')); } else refresh(false);
      } })
    ])];
    show(nodes);
  }

  async function refresh(silent) {
    if (loading) return;
    loading = true;
    var seq = ++reqSeq;
    try {
      var tA = performance.now();
      var first = !firstDone;                       /* 只有開頁那一次要算 LINE 初始化；之後手動重新整理從按下去才開始算 */
      var r = await api('me');
      var tApi = performance.now() - tA;
      firstDone = true;
      if (seq < appliedSeq) return;                 /* 晚回來的舊回應不能蓋掉新結果 */
      appliedSeq = seq; render(r);
      var ms = Math.round(performance.now() - (first ? T0 : tA));
      var pf = r._perf || {}, sec = function (v) { return (v / 1000).toFixed(1); };
      if (!silent && DEBUG) stamp.textContent += '　' + (first ? '開頁共 ' : '本次共 ') + sec(ms) + ' 秒（' + (first ? 'LINE ' + sec(tLiff) + '、' : '') + '等回應 ' + sec(tApi) +
        (pf.total != null ? '；後端 ' + sec(pf.total) + '＝驗證 ' + sec(pf.verify || 0) + '＋設定 ' + sec(pf.cfg || 0) + '＋檢查 ' + sec(pf.tick || 0) + '＋動作 ' + sec(pf.act || 0) : '') + '）';
      if (!silent && first && ms > 3000) queueLog({ what: '開頁', result: '慢', ms: ms, detail: 'LINE ' + (tLiff / 1000).toFixed(1) + 's 等回應 ' + (tApi / 1000).toFixed(1) + 's 後端 ' + JSON.stringify(r._perf || {}) + (cached ? ' 有舊畫面' : ' 無舊畫面') });
      if (!silent) flushLogs();
    }
    catch (e) { if (!silent) renderError(e); }
    finally { loading = false; }
  }

  /* 輪詢只在已報名時進行，避免洗掉使用者正在輸入的邀請碼 */
  function pollable() {
    return document.visibilityState === 'visible' && current && current.status !== 'unregistered';
  }
  setInterval(function () { if (pollable()) refresh(true); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () { if (pollable()) refresh(true); });
  document.getElementById('reload').addEventListener('click', function () { refresh(false); });

  if (LIFF_ID.indexOf('YOUR_') === 0 || GAS_URL.indexOf('YOUR_') !== -1) {
    show([card([h('p', { class: 'label', text: '尚未設定' }),
                h('p', { text: '請在 index.html 填入 LIFF_ID 與 GAS_URL。' })])]);
    foot.hidden = true;
    return;
  }

  /* 開頁先「敲門」：喚醒後端、先建好連線；有上次的畫面就先顯示 */
  try { fetch(GAS_URL, { cache: 'no-store' }).catch(function () {}); } catch (_) {}
  var tLiff = 0, firstDone = false;
  /* 耗時分段只在除錯時顯示：網址加 ?debug=1，或在瀏覽器存 localStorage.tm_debug = '1' */
  var DEBUG = false;
  try { DEBUG = /[?&]debug=1/.test(location.search) || localStorage.getItem('tm_debug') === '1'; } catch (_) {}
  var cached = loadView();
  if (cached) { render(cached); stamp.textContent = '顯示上次資料，更新中…'; }

  liff.init({ liffId: LIFF_ID }).then(function () {
    tLiff = performance.now() - T0;
    if (!cached) show([card([h('p', { class: 'hint', text: '已連上 LINE，正在向伺服器取得資料…（第一次可能要幾秒）' })])]);
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    return refresh(false);
  }).catch(function (e) { queueLog({ what: '開頁', result: 'LIFF 初始化失敗', ms: Math.round(performance.now() - T0), detail: String(e && (e.message || e)) }); renderError({ code: 'server' }); });
})();
</script>
</body>
</html>
